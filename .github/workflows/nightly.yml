# The nightly upgrade (see "The nightly" in README.md): advance F* to the
# tip of its master and every other project to the tip of its default
# branch, with its `olympus` branch rebased on top, build everything from
# scratch, and have Copilot repair whatever stopped building. Once every
# project builds, record the commits in hashes.txt and push.
#
#                    one job per target (nightly-project.yml):
#   Set up -> F* -> build; if it fails, Copilot repairs it (once, no
#                   budget) and the repair is built from scratch; then
#                   push it (olympus branch, or pull request)  -> Publish
#
# F* is the latest F* nightly (FStarLang/FStar-nightly). A target starts as
# soon as F* and its dependencies (deps_of in lib.sh) have built: atlas
# waits for everparse and hacl-pulse, with their repairs. Its job fails
# exactly when it does not build, even after a repair. Each project is
# pushed as soon as it builds; hashes.txt is recorded only if all of them
# do.
#
# It runs on the same self-hosted runners as the Build workflow, in a tree
# and an opam switch of its own, so that it does not disturb a Build.
name: Nightly

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      fix:
        description: >-
          Have Copilot repair the projects that stop building. Turn this off
          to only report.
        type: boolean
        default: true
      publish:
        description: >-
          Push each project that builds (its olympus branch, or a pull
          request), and record hashes.txt on main when everything builds.
          Turn this off to try the nightly without changing anything.
        type: boolean
        default: true
      force:
        description: Build even when no project has anything new.
        type: boolean
        default: false
      fstar_rev:
        description: >-
          The F* nightly (nightly-YYYY-MM-DD), branch or commit to advance
          to (empty means the latest nightly).
        type: string
        required: false
      model:
        description: The model that Copilot uses.
        type: string
        default: claude-opus-5.5

permissions:
  contents: read

# One nightly at a time, and never two on the same trees. Separate from the
# Build workflow's group: it has a tree of its own.
concurrency:
  group: olympus-nightly
  cancel-in-progress: false

env:
  # What is built is always from scratch.
  CLEAN: '1'
  # A tree and an opam switch that the Build workflow does not use.
  OLYMPUS_WORK_NAME: olympus-nightly-work
  OLYMPUS_OPAM_SWITCH: olympus-nightly
  # The projects are all public; this only spares the gh API calls (the F*
  # nightly, open pull requests, ...) the anonymous rate limit. Secrets with
  # more power than that are given only to the steps that need them.
  GH_TOKEN: ${{ github.token }}
  OLYMPUS_JOBS: ${{ vars.OLYMPUS_JOBS }}
  # The OlympusMons GitHub App, whose installation tokens push (see "The
  # nightly" in README.md); its private key is the OLYMPUS_APP_PRIVATE_KEY
  # secret. (Not its client ID, which create-github-app-token prefers but
  # GitHub rejects when making an installation token for an organization.)
  OLYMPUS_APP_ID: 5823841

jobs:
  setup:
    name: Set up
    runs-on: [self-hosted, linux, x64, olympus]
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    outputs:
      go: ${{ steps.go.outputs.go }}
      minutes: ${{ steps.minutes.outputs.minutes }}
      fix: ${{ steps.tokens.outputs.fix }}
      # Only a run of main changes anything.
      push: >-
        ${{ github.ref == 'refs/heads/main' &&
        (github.event_name != 'workflow_dispatch' || inputs.publish) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/olympus-runner
        with:
          jobs: all

      - name: Forget the results of the last run
        run: |
          rm -f "$OLYMPUS_WORK"/status/* "$OLYMPUS_WORK"/logs/*.diagnostics.log
          rm -rf "$OLYMPUS_WORK/nightly"

      # Seconds, not hours: can the nightly do what it is for? A push token
      # that cannot be made is left empty, for the check to report.
      - name: Get a push token for FStarLang
        id: app-fstarlang
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ env.OLYMPUS_APP_ID }}
          private-key: ${{ secrets.OLYMPUS_APP_PRIVATE_KEY }}
          owner: FStarLang

      - name: Get a push token for project-everest
        id: app-everest
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ env.OLYMPUS_APP_ID }}
          private-key: ${{ secrets.OLYMPUS_APP_PRIVATE_KEY }}
          owner: project-everest

      - name: Check the secrets
        id: tokens
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          OLYMPUS_PUSH_TOKEN_FSTARLANG: ${{ steps.app-fstarlang.outputs.token }}
          OLYMPUS_PUSH_TOKEN_PROJECT_EVEREST: ${{ steps.app-everest.outputs.token }}
          PUBLISH: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
          FIX: ${{ github.event_name != 'workflow_dispatch' || inputs.fix }}
        run: scripts/nightly/preflight.sh

      - name: Check that every repository can be read
        run: scripts/ci/preflight.sh

      - name: Work out how long each target may take
        id: minutes
        run: echo "minutes=$(scripts/ci/matrix.sh --minutes)" >> "$GITHUB_OUTPUT"

      # From hashes.txt: the candidate commits do not exist until this step
      # has written them, so OLYMPUS_HASHES only points at them after it.
      - name: Work out what to try
        id: advance
        env:
          FSTAR_REV: ${{ inputs.fstar_rev }}
        run: scripts/nightly/advance.sh "$OLYMPUS_WORK/candidate-hashes.txt" | tee "$RUNNER_TEMP/advance.txt"

      - name: Use the candidate commits
        run: echo "OLYMPUS_HASHES=$OLYMPUS_WORK/candidate-hashes.txt" >> "$GITHUB_ENV"

      - name: Decide whether there is anything to do
        id: go
        env:
          CHANGED: ${{ steps.advance.outputs.changed }}
          FORCE: ${{ inputs.force }}
        run: |
          go=false
          { [ "$CHANGED" = true ] || [ "$FORCE" = true ]; } && go=true
          echo "go=$go" >> "$GITHUB_OUTPUT"
          [ "$go" = true ] || echo "Nothing is newer than hashes.txt: nothing to do."
          {
            echo '### What the nightly tries'
            echo
            echo '```'
            cat "$RUNNER_TEMP/advance.txt"
            echo '```'
            [ "$go" = true ] || echo 'Nothing is newer than hashes.txt: nothing to do.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the candidate commits
        if: steps.go.outputs.go == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: candidate-hashes
          path: ${{ env.OLYMPUS_HASHES }}
          retention-days: 14

      # The Z3 to install is the one that the candidate F* uses by default,
      # which setup.sh reads from its source.
      - name: Set up opam and Z3
        if: steps.go.outputs.go == 'true'
        run: |
          scripts/checkout.sh FStar
          scripts/setup.sh

      # Only to get the clones out of the way before the jobs start. A
      # project that cannot be checked out is left to its own job.
      - name: Check out every project
        if: steps.go.outputs.go == 'true'
        run: |
          source scripts/lib.sh
          for p in "${PROJECTS[@]:1}"; do
            scripts/checkout.sh "$p" || echo "::warning::$p: checkout failed"
          done

  fstar:
    name: F*
    needs: setup
    if: needs.setup.outputs.go == 'true'
    runs-on: [self-hosted, linux, x64, olympus]
    timeout-minutes: 80
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/olympus-runner
        with:
          jobs: all

      - name: Use the candidate commits
        run: echo "OLYMPUS_HASHES=$OLYMPUS_WORK/candidate-hashes.txt" >> "$GITHUB_ENV"

      - name: Build F* and install it as a package
        run: scripts/run.sh FStar

      - name: Summary
        if: always()
        run: scripts/ci/job-summary.sh FStar

      - name: Collect the log
        if: always()
        run: scripts/ci/collect-logs.sh FStar

      - name: Upload the log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: log-FStar
          path: ci-logs/
          retention-days: 14
          if-no-files-found: warn

  # One job per target: keep these in step with TARGETS and deps_of in
  # scripts/lib.sh. A target that does not build, even after Copilot's
  # repair, fails its job, and the jobs of the targets that depend on it are
  # skipped.

  # F*'s own tests: a failure is F*'s, not something to repair here.
  FStar-ci:
    name: FStar-ci
    needs: [setup, fstar]
    if: needs.setup.outputs.go == 'true'
    uses: ./.github/workflows/nightly-project.yml
    with:
      target: FStar-ci
      minutes: ${{ fromJSON(needs.setup.outputs.minutes)['FStar-ci'] }}
      fix: false
      project: false
    secrets: inherit

  everparse:
    name: everparse
    needs: [setup, fstar]
    if: needs.setup.outputs.go == 'true'
    uses: ./.github/workflows/nightly-project.yml
    with:
      target: everparse
      minutes: ${{ fromJSON(needs.setup.outputs.minutes)['everparse'] }}
      fix: ${{ needs.setup.outputs.fix == 'true' }}
      model: ${{ inputs.model || 'claude-opus-5.5' }}
      push: ${{ needs.setup.outputs.push == 'true' }}
    secrets: inherit

  pal:
    name: pal
    needs: [setup, fstar]
    if: needs.setup.outputs.go == 'true'
    uses: ./.github/workflows/nightly-project.yml
    with:
      target: pal
      minutes: ${{ fromJSON(needs.setup.outputs.minutes)['pal'] }}
      fix: ${{ needs.setup.outputs.fix == 'true' }}
      model: ${{ inputs.model || 'claude-opus-5.5' }}
      push: ${{ needs.setup.outputs.push == 'true' }}
    secrets: inherit

  kuiper:
    name: kuiper
    needs: [setup, fstar]
    if: needs.setup.outputs.go == 'true'
    uses: ./.github/workflows/nightly-project.yml
    with:
      target: kuiper
      minutes: ${{ fromJSON(needs.setup.outputs.minutes)['kuiper'] }}
      fix: ${{ needs.setup.outputs.fix == 'true' }}
      model: ${{ inputs.model || 'claude-opus-5.5' }}
      push: ${{ needs.setup.outputs.push == 'true' }}
    secrets: inherit

  pulse-verified-gc:
    name: pulse-verified-gc
    needs: [setup, fstar]
    if: needs.setup.outputs.go == 'true'
    uses: ./.github/workflows/nightly-project.yml
    with:
      target: pulse-verified-gc
      minutes: ${{ fromJSON(needs.setup.outputs.minutes)['pulse-verified-gc'] }}
      fix: ${{ needs.setup.outputs.fix == 'true' }}
      model: ${{ inputs.model || 'claude-opus-5.5' }}
      push: ${{ needs.setup.outputs.push == 'true' }}
    secrets: inherit

  AlgoStar:
    name: AlgoStar
    needs: [setup, fstar]
    if: needs.setup.outputs.go == 'true'
    uses: ./.github/workflows/nightly-project.yml
    with:
      target: AlgoStar
      minutes: ${{ fromJSON(needs.setup.outputs.minutes)['AlgoStar'] }}
      fix: ${{ needs.setup.outputs.fix == 'true' }}
      model: ${{ inputs.model || 'claude-opus-5.5' }}
      push: ${{ needs.setup.outputs.push == 'true' }}
    secrets: inherit

  hacl-pulse:
    name: hacl-pulse
    needs: [setup, fstar]
    if: needs.setup.outputs.go == 'true'
    uses: ./.github/workflows/nightly-project.yml
    with:
      target: hacl-pulse
      minutes: ${{ fromJSON(needs.setup.outputs.minutes)['hacl-pulse'] }}
      fix: ${{ needs.setup.outputs.fix == 'true' }}
      model: ${{ inputs.model || 'claude-opus-5.5' }}
      push: ${{ needs.setup.outputs.push == 'true' }}
    secrets: inherit

  atlas:
    name: atlas
    needs: [setup, fstar, everparse, hacl-pulse]
    if: needs.setup.outputs.go == 'true'
    uses: ./.github/workflows/nightly-project.yml
    with:
      target: atlas
      minutes: ${{ fromJSON(needs.setup.outputs.minutes)['atlas'] }}
      fix: ${{ needs.setup.outputs.fix == 'true' }}
      model: ${{ inputs.model || 'claude-opus-5.5' }}
      push: ${{ needs.setup.outputs.push == 'true' }}
    secrets: inherit

  publish:
    name: Publish
    needs:
      - setup
      - fstar
      - FStar-ci
      - everparse
      - pal
      - kuiper
      - pulse-verified-gc
      - AlgoStar
      - hacl-pulse
      - atlas
    if: always() && needs.setup.outputs.go == 'true'
    runs-on: [self-hosted, linux, x64, olympus]
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      # What this run can claim: everything built (with Copilot's repairs,
      # built from scratch), or nothing is recorded.
      - name: Does everything build?
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          mapfile -t why < <(jq -r 'to_entries[] | select(.value.result != "success")
                                    | "\(.key): \(.value.result)"' <<< "$NEEDS")
          if [ "${#why[@]}" -gt 0 ]; then
            {
              echo '## :x: Nothing was recorded'
              echo
              echo 'Not everything builds (a skipped target is one whose dependencies did not):'
              echo
              printf -- '- %s\n' "${why[@]}"
            } | tee -a "$GITHUB_STEP_SUMMARY"
            printf '::error::The nightly could not record anything: %s\n' "${why[*]}"
            exit 1
          fi

      - name: Get a push token for this repository
        id: app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ env.OLYMPUS_APP_ID }}
          private-key: ${{ secrets.OLYMPUS_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}

      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          # The token is what pushes, and what makes the push start a
          # Build of the new hashes.txt (the default token's pushes do not).
          token: ${{ steps.app.outputs.token }}

      - uses: ./.github/actions/olympus-runner

      # Everything has now been built from scratch, and each project's job
      # has pushed what it built (rebased, and repaired, as the jobs left
      # them in $OLYMPUS_WORK/nightly/fixed): record it.
      - name: Record the commits that were built
        env:
          # Only a run of main can change main.
          PUSH: ${{ needs.setup.outputs.push == 'true' && '1' || '0' }}
          BASE: ${{ github.sha }}
        run: |
          fixed=$OLYMPUS_WORK/nightly/fixed
          mkdir -p "$fixed"
          {
            REQUIRE_PUSHED=$PUSH scripts/nightly/publish.sh \
              "$OLYMPUS_WORK/candidate-hashes.txt" "$fixed" "$BASE"
            if [ "$PUSH" = 1 ]; then
              git push origin HEAD:main
            else
              echo "(not pushing: a dry run, or not a run of main)"
            fi
          } 2>&1 | tee "$RUNNER_TEMP/publish.txt"
          {
            echo '## Recorded'
            echo
            echo '```'
            cat "$RUNNER_TEMP/publish.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
